name: Debug Monitor

on: push

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug info
        run: |
          echo "::debug::Iniciando diagnostico do pipeline"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          echo "Workspace: $GITHUB_WORKSPACE"

      - name: Verificar arquivos do projeto
        run: |
          if [ -f "pom.xml" ]; then
            echo "pom.xml encontrado"
          else
            echo "::error file=pom.xml::pom.xml nao encontrado no repositorio"
          fi

          if [ -f "Dockerfile" ]; then
            echo "Dockerfile encontrado"
          else
            echo "::warning file=Dockerfile::Dockerfile nao encontrado - build de imagem pode falhar"
          fi

      - name: Verificar estrutura
        run: |
          if [ ! -d "src" ]; then
            echo "::error::Diretorio src nao encontrado - projeto pode estar incompleto"
            echo "Sugestao: verifique se o checkout foi feito corretamente"
          else
            echo "Estrutura do projeto OK"
          fi

      - name: Warning de exemplo
        run: echo "::warning::Lembre-se de configurar os secrets antes de rodar o deploy"

      - name: Diagnostico e sugestoes de melhoria
        run: |
          echo "== Diagnostico automatizado =="
          echo ""

          if [ ! -f ".dockerignore" ]; then
            echo "::warning::.dockerignore nao encontrado - recomendado criar para reduzir o tamanho da imagem Docker"
          fi

          if [ ! -f "docker-compose.yml" ]; then
            echo "::warning::docker-compose.yml nao encontrado - considere criar para facilitar o desenvolvimento local"
          fi

          if ! grep -q "spring.profiles" src/main/resources/application.yaml 2>/dev/null; then
            echo "::warning::Nenhum profile Spring detectado - considere usar profiles (dev, staging, prod) para separar configuracoes"
          fi

          echo ""
          echo "Sugestoes de correcao para falhas comuns:"
          echo "  1. Se o build falhar: verifique se o pom.xml esta correto e rode 'mvnw dependency:resolve'"
          echo "  2. Se os testes falharem: confirme que o banco PostgreSQL esta acessivel e o schema foi aplicado"
          echo "  3. Se o deploy falhar: confira os secrets e variables em Settings > Secrets and variables"
          echo "  4. Se a imagem Docker nao subir: verifique o login no Docker Hub com 'docker login'"

      - name: Gerar job summary
        run: |
          echo "## Resultado do Diagnostico" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | $RUNNER_OS ($RUNNER_ARCH) |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | $GITHUB_REF_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $GITHUB_SHA |" >> $GITHUB_STEP_SUMMARY
          echo "| pom.xml | Verificado |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | Verificado |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sugestoes" >> $GITHUB_STEP_SUMMARY
          echo "- Adicionar .dockerignore para otimizar build" >> $GITHUB_STEP_SUMMARY
          echo "- Considerar profiles Spring para ambientes diferentes" >> $GITHUB_STEP_SUMMARY
          echo "- Manter secrets e variables atualizados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Diagnostico finalizado com sucesso" >> $GITHUB_STEP_SUMMARY

      - name: Diagnostico em caso de falha
        if: failure()
        run: |
          echo "::error::Pipeline falhou - diagnostico automatico"
          echo ""
          echo "Possiveis causas:"
          echo "  1. Arquivo pom.xml ausente ou corrompido"
          echo "  2. Secrets nao configurados no repositorio"
          echo "  3. Dependencias nao resolvidas"
          echo ""
          echo "Sugestoes de correcao:"
          echo "  - Verifique se o repositorio esta completo"
          echo "  - Confira os secrets em Settings > Secrets"
          echo "  - Rode 'mvnw dependency:resolve' localmente"
