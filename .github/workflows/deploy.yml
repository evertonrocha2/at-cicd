name: Deploy Pipeline

on:
  push:
    branches:
      - main

env:
  APP_NAME: ufo-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Rodar testes antes do deploy
        run: chmod +x mvnw && ./mvnw test

  validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Validar variaveis obrigatorias
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
        run: |
          echo "Validando variaveis antes do deploy..."
          MISSING=""
          if [ -z "$DB_PASSWORD" ]; then MISSING="$MISSING DB_PASSWORD"; fi
          if [ -z "$PROD_DOMAIN" ]; then MISSING="$MISSING PROD_DOMAIN"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Variaveis faltando:$MISSING"
            exit 1
          fi
          echo "Todas as variaveis obrigatorias estao configuradas"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy para producao
        env:
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fazendo deploy de $APP_NAME para $PROD_DOMAIN"
          echo "Deploy realizado com sucesso"
          echo "GITHUB_TOKEN utilizado para autenticacao no workflow"
