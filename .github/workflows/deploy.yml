name: Deploy Pipeline

on:
  push:
    branches:
      - main

env:
  APP_NAME: ufo-tracker

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devops2025!
          POSTGRES_DB: ufology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar schema do banco
        run: PGPASSWORD=devops2025! psql -h localhost -U postgres -d ufology -f docker/database/01_schema.sql

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Rodar testes antes do deploy
        env:
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: devops2025!
        run: chmod +x mvnw && ./mvnw test

  validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Validar variaveis obrigatorias
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
        run: |
          echo "Validando variaveis antes do deploy..."
          MISSING=""
          if [ -z "$DB_PASSWORD" ]; then MISSING="$MISSING DB_PASSWORD"; fi
          if [ -z "$PROD_DOMAIN" ]; then MISSING="$MISSING PROD_DOMAIN"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Variaveis faltando:$MISSING"
            exit 1
          fi
          echo "Todas as variaveis obrigatorias estao configuradas"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy para producao
        env:
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fazendo deploy de $APP_NAME para $PROD_DOMAIN"
          echo "Deploy realizado com sucesso"
          echo "GITHUB_TOKEN utilizado para autenticacao no workflow"
