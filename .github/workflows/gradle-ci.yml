name: Maven CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devops2025!
          POSTGRES_DB: ufology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Criar schema do banco
        run: PGPASSWORD=devops2025! psql -h localhost -U postgres -d ufology -f docker/database/01_schema.sql

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        env:
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: devops2025!
        run: chmod +x mvnw && ./mvnw test

      - name: Build with Maven
        run: ./mvnw package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufo-tracker-jar
          path: target/*.jar
