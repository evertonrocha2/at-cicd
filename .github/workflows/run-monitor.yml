name: Run Monitor

on: push

# variavel no nivel do workflow
env:
  APP_NAME: ufo-tracker
  VERSION: "1.0.0"

jobs:
  info:
    runs-on: ubuntu-latest
    # variavel no nivel do job
    env:
      JOB_ENV: monitoring
    steps:
      - name: Mostrar variavel do workflow
        run: echo "App $APP_NAME versao $VERSION"

      - name: Mostrar variavel do job
        run: echo "Job rodando em modo $JOB_ENV"

      - name: Mostrar variavel do step
        # variavel no nivel do step
        env:
          STEP_ACTION: health-check
        run: echo "Executando acao $STEP_ACTION"

      - name: Usar vars do repositorio
        run: echo "Variavel do repo - DEPLOY_ENV=${{ vars.DEPLOY_ENV }}"

      - name: Usar GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GITHUB_TOKEN disponivel para autenticacao em workflows"
          echo "Usado para interagir com a API do GitHub de forma autenticada"

  check-secret:
    runs-on: ubuntu-latest
    env:
      REGION: us-east-1
    steps:
      - name: Usar secret API_KEY
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API_KEY configurado com sucesso"
          else
            echo "API_KEY nao encontrado"
          fi

      - name: Mostrar variavel de job
        run: echo "Region $REGION"
