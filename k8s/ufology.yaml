# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ufology

---

# PostgreSQL - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ufology
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: leogloriainfnet/ufodb:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "devops2025!"
            - name: POSTGRES_DB
              value: "ufology"

---

# PostgreSQL - Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ufology
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---

# Redis - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ufology
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---

# Redis - Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ufology
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP

---

# ConfigMap da aplicacao
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ufology
data:
  DB_NAME: "ufology"

---

# Secret do banco
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ufology
type: Opaque
stringData:
  DB_PASSWORD: "devops2025!"

---

# App - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufo-tracker
  namespace: ufology
  labels:
    app: ufo-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ufo-tracker
  template:
    metadata:
      labels:
        app: ufo-tracker
    spec:
      containers:
        - name: ufo-tracker
          image: evertonrocha2/ufo-tracker:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/ufology"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: POSTGRES_USERNAME
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD

---

# App - Service
apiVersion: v1
kind: Service
metadata:
  name: ufo-tracker
  namespace: ufology
  labels:
    app: ufo-tracker
spec:
  type: ClusterIP
  selector:
    app: ufo-tracker
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
